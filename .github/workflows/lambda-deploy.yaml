name: Deploy Lambda Function
on: 
  push:
    branches:
      - main
    paths:
        - 'lambda/**'
jobs:
  deploy-lambda: #name of our job
    runs-on: ubuntu-latest # sets or specifies the type of machine to run on
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python #Sets up python env
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies #installs dependencies from requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r lambda/requirements.txt -t lambda/

      - name: Configure AWS credentials # sets up AWS credentials for the action to use
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1
          
      - name: Deploy to AWS Lambda
        run: |
          cd lambda
          zip -r lambda.zip .
          aws lambda update-function-code --function-name my-test-cicd --zip-file fileb://lambda.zip